name: RaceDay Part 1 Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-part1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docs folder
        run: test -d docs

      - name: Check ERD
        run: test -f docs/RaceDay_ERD.png

      - name: Check API endpoint plan
        run: test -f docs/API_Endpoint_Plan.md

      - name: Check SQL script
        run: test -f docs/RaceDay_Database.sql

      - name: Check README
        run: test -f README.md

      - name: Validation successful
        run: echo "RaceDay Part 1 repository structure is valid."
